name: Release Poster

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag (e.g. v1.2.0). If empty, auto-generated."
        required: false
        type: string
      release_name:
        description: "Optional release title."
        required: false
        type: string
  repository_dispatch:
    types: [dreimetadaten-release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-luatex texlive-latex-extra fonts-texgyre

      - name: Generate table and optimized covers
        run: python get_tabelle.py

      - name: Build PDF
        run: lualatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            upstream_tag="${{ github.event.client_payload.upstream_tag }}"
            tag="dreimetadaten-${upstream_tag}"
            name="Poster Build for dreimetadaten ${upstream_tag}"
          else
            input_tag="${{ github.event.inputs.release_tag }}"
            input_name="${{ github.event.inputs.release_name }}"
            if [[ -n "$input_tag" ]]; then
              tag="$input_tag"
            else
              tag="poster-$(date +%Y%m%d-%H%M%S)"
            fi
            if [[ -n "$input_name" ]]; then
              name="$input_name"
            else
              name="Poster ${tag}"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: poster-pdf-release
          path: main.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          files: |
            main.pdf
          generate_release_notes: true
          make_latest: true
