name: Check dreimetadaten Release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Check latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/YourMJK/dreimetadaten/releases/latest --jq .tag_name)
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "No upstream release tag found" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check if corresponding local release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.upstream.outputs.tag }}"
          if gh api "repos/${{ github.repository }}/releases/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger release workflow for new upstream release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -X POST \
            -f event_type=dreimetadaten-release \
            -f client_payload='{"upstream_tag":"${{ steps.upstream.outputs.tag }}"}'
